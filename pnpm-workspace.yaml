packages:
  - "packages/*"

engineStrict: true

overrides:
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  micromark-util-types@^2: 2.0.2
  mdast-util-from-markdown@^2: 2.0.2
  # Keep exactly one @ai-sdk/provider + provider-utils so `instanceof APICallError`
  # holds across every provider package (matches upstream).
  '@ai-sdk/provider': 3.0.19
  '@ai-sdk/provider-utils': 4.0.64

minimumReleaseAgeExclude:
  - '@cherrystudio/ai-core@2.5.2'
  - '@cherrystudio/file-preview@0.5.1'
  - '@cherrystudio/provider-registry@0.7.1'
  - '@cherrystudio/web-search@0.9.0'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  '@swc/core': true
  protobufjs: true
  tesseract.js: true
  '@google/genai': false
  '@sentry/cli': false
  msw: false
  registry-js: false
  # Types only: the web build ships no Electron binary.
  electron: false

patchedDependencies:
  "@ai-sdk/mistral@3.0.30": patches/@ai-sdk__mistral@3.0.30.patch
  "dingtalk-stream@2.1.7-beta.1": patches/dingtalk-stream@2.1.7-beta.1.patch
  "@anthropic-ai/claude-agent-sdk@0.3.311": patches/@anthropic-ai__claude-agent-sdk@0.3.311.patch
  "tesseract.js@6.0.1": patches/tesseract.js-npm-6.0.1-2562a7e46d.patch
  "file-stream-rotator@0.6.1": patches/file-stream-rotator-npm-0.6.1-eab45fb13d.patch
  "ollama-ai-provider-v2@3.3.1": patches/ollama-ai-provider-v2@3.3.1.patch
  "@opeoginni/github-copilot-openai-compatible@1.0.0": patches/@opeoginni__github-copilot-openai-compatible@1.0.0.patch
  "@ai-sdk/amazon-bedrock@4.0.96": patches/@ai-sdk__amazon-bedrock@4.0.96.patch
  "@ai-sdk/openai@3.0.137": patches/@ai-sdk__openai@3.0.137.patch
  "@ai-sdk/google@3.0.146": patches/@ai-sdk__google@3.0.146.patch
  "@tiptap/extension-drag-handle@3.26.1": patches/@tiptap__extension-drag-handle@3.26.1.patch
  "@tiptap/markdown@3.26.1": patches/@tiptap__markdown@3.26.1.patch
