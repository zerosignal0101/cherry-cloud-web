# /etc/nginx/sites-available/cherry-cloud-web
#
# Terminates TLS and forwards HTTP plus the two WebSocket endpoints. Keep the
# upstream on loopback; the application requires a single instance per DATA_DIR.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cherry_cloud_web {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name cherry.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cherry.example.com;

    ssl_certificate     /etc/letsencrypt/live/cherry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cherry.example.com/privkey.pem;

    # Uploads are capped at 100 MiB by the application; leave headroom for
    # multipart overhead.
    client_max_body_size 128m;
    client_body_timeout 120s;

    # Do not compress media or event streams.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ws {
        proxy_pass http://cherry_cloud_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://cherry_cloud_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
